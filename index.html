                              }}
                            />
                            <span className="text-sm text-slate-600">{t('monthSuffix')}</span>
                            <input
                              type="number" min="1" max="31" className="w-14 border rounded p-1 text-center"
                              value={newContract.paymentDayConfig.customDate ? parseInt(newContract.paymentDayConfig.customDate.split('-')[1]) : 1}
                              onChange={e => {
                                const mm = newContract.paymentDayConfig.customDate ? newContract.paymentDayConfig.customDate.split('-')[0] : '01';
                                const dd = String(Math.max(1, Math.min(31, parseInt(e.target.value) || 1))).padStart(2, '0');
                                setNewContract({ ...newContract, paymentDayConfig: { ...newContract.paymentDayConfig, customDate: `${mm}-${dd}` } });
                              }}
                            />
                            <span className="text-sm text-slate-600">{language === 'en' ? '' : '日'}</span>
                          </div>
                        )}
                      </div>
                    )}

                    {/* Per-period amount preview */}
                    {newContract.rentAmount && (
                      <div className="mt-2 text-xs text-slate-500 flex items-center gap-2">
                        <Icons.DollarSign size={12} />
                        <span>
                          {t('perPeriodAmount')}: $
                          {(() => {
                            const rent = parseInt(newContract.rentAmount) || 0;
                            const m = { monthly: 1, quarterly: 3, 'semi-annual': 6, annual: 12 };
                            return (rent * (m[newContract.paymentFrequency] || 1)).toLocaleString();
                          })()}
                        </span>
                      </div>
                    )}
                  </div>

                  {/* Contract copy (shared with tenant) */}
                  {newContract.tenantId && (() => {
                    const selectedTenant = tenants.find(t => t.id === newContract.tenantId);
                    const contractImgs = selectedTenant?.contractImages || [];
                    return (
                      <div className="pt-3 border-t">
                        <ImageUploader
                          label={language === 'en' ? '📄 Contract Copy (shared with tenant)' : '📄 契約影本（與租客資料共用）'}
                          imageIds={contractImgs}
                          multiple={true}
                          onUpload={(id) => {
                            setTenants(tenants.map(t =>
                              t.id === newContract.tenantId
                                ? { ...t, contractImages: [...(t.contractImages || []), id] }
                                : t
                            ));
                          }}
                          onDelete={(id) => {
                            deleteImage(id);
                            setTenants(tenants.map(t =>
                              t.id === newContract.tenantId
                                ? { ...t, contractImages: (t.contractImages || []).filter(i => i !== id) }
                                : t
                            ));
                          }}
                        />
                        {contractImgs.length > 0 && (
                          <p className="text-xs text-slate-400 mt-1">ℹ️ {t('contractImageShared')}</p>
                        )}
                      </div>
                    );
                  })()}
                </div>
                <div className="mt-6 flex justify-end gap-3">
                  <Button variant="secondary" onClick={() => setIsContractModalOpen(false)}>{t('cancel')}</Button>
                  <Button onClick={handleCreateContract} variant="primary">{t('signIn')}</Button>
                </div>
              </Card>
            </div>
          )}

          {/* Payment Modal (Create & Edit) */}
          {isPaymentModalOpen && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
              <Card className="w-full max-w-lg p-6 animate-fadeIn max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-xl font-bold flex items-center gap-2">
                    <Icons.DollarSign className="text-green-600" />
                    {editingPayment ? t('editPaymentTitle') : t('addPaymentTitle')}
                  </h3>
                  <button onClick={() => setIsPaymentModalOpen(false)} className="text-slate-400 hover:text-slate-600">
                    <Icons.Plus className="rotate-45" size={24} />
                  </button>
                </div>

                <div className="space-y-4">
                  {/* Contract selector */}
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">{t('linkedContract')} *</label>
                    <select
                      className="w-full border-2 border-slate-200 rounded-lg p-3 focus:border-indigo-500 focus:outline-none"
                      value={paymentForm.contractId}
                      onChange={e => {
                        const contract = contracts.find(c => c.id === e.target.value);
                        setPaymentForm({
                          ...paymentForm,
                          contractId: e.target.value,
                          amount: contract ? contract.rentAmount : paymentForm.amount
                        });
                      }}
                    >
                      <option value="">{t('selectContract')}</option>
                      {contracts.filter(c => c.status === 'active').map(c => {
                        const prop = properties.find(p => p.id === c.propertyId);
                        const tenant = tenants.find(t => t.id === c.tenantId);
                        return (
                          <option key={c.id} value={c.id}>
                            {prop?.name || t('unknownProp')} - {tenant?.name || t('unknownTenant')} (${c.rentAmount.toLocaleString()}/{language === 'en' ? 'mo' : t('calendarMonth')})
                          </option>
                        );
                      })}
                    </select>
                  </div>

                  {/* Due date & amount */}
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">{t('dueDate')} *</label>
                      <input
                        type="date"
                        className="w-full border-2 border-slate-200 rounded-lg p-3 focus:border-indigo-500 focus:outline-none"
                        value={paymentForm.dueDate}
                        onChange={e => setPaymentForm({ ...paymentForm, dueDate: e.target.value })}
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">{t('dueAmount')} *</label>
                      <input
                        type="number"
                        className="w-full border-2 border-slate-200 rounded-lg p-3 focus:border-indigo-500 focus:outline-none"
                        placeholder={language === 'en' ? 'e.g., 18000' : '例：18000'}
                        value={paymentForm.amount}
                        onChange={e => setPaymentForm({ ...paymentForm, amount: e.target.value })}
                      />
                    </div>
                  </div>

                  {/* Status */}
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">{t('paymentStatus')}</label>
                    <div className="flex gap-2">
                      {[
                        { value: 'pending', labelKey: 'statusPending', color: 'bg-yellow-100 text-yellow-700 border-yellow-300' },
                        { value: 'paid', labelKey: 'statusPaid', color: 'bg-green-100 text-green-700 border-green-300' },
                        { value: 'overdue', labelKey: 'statusOverdue', color: 'bg-red-100 text-red-700 border-red-300' }
                      ].map(status => (
                        <button
                          key={status.value}
                          type="button"
                          className={`flex-1 py-2 px-3 rounded-lg border-2 font-medium transition-all ${paymentForm.status === status.value
                            ? status.color + ' border-current'
                            : 'bg-slate-50 text-slate-500 border-slate-200 hover:bg-slate-100'
                            }`}
                          onClick={() => setPaymentForm({ ...paymentForm, status: status.value })}
                        >
                          {t(status.labelKey)}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Actual payment date */}
                  {paymentForm.status === 'paid' && (
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">{t('actualPayDate')}</label>
                      <input
                        type="date"
                        className="w-full border-2 border-slate-200 rounded-lg p-3 focus:border-indigo-500 focus:outline-none"
                        value={paymentForm.paidDate}
                        onChange={e => setPaymentForm({ ...paymentForm, paidDate: e.target.value })}
                      />
                    </div>
                  )}

                  {/* Payment proof image */}
                  <div className="pt-3 border-t">
                    <ImageUploader
                      label={language === 'en' ? '📃 Payment Proof' : '📃 繳款證明圖片'}
                      imageIds={paymentForm.proofImage}
                      single={true}
                      onUpload={(id) => {
                        if (paymentForm.proofImage) deleteImage(paymentForm.proofImage);
                        setPaymentForm({ ...paymentForm, proofImage: id });
                      }}
                      onDelete={(id) => {
                        deleteImage(id);
                        setPaymentForm({ ...paymentForm, proofImage: null });
                      }}
                    />
                  </div>

                  {/* Notes */}
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">{t('notes')}</label>
                    <textarea
                      className="w-full border-2 border-slate-200 rounded-lg p-3 focus:border-indigo-500 focus:outline-none"
                      rows="2"
                      placeholder={language === 'en' ? 'Optional notes...' : '可選填備註...'}
                      value={paymentForm.notes}
                      onChange={e => setPaymentForm({ ...paymentForm, notes: e.target.value })}
                    />
                  </div>
                </div>

                <div className="mt-6 flex justify-end gap-3">
                  <Button variant="secondary" onClick={() => setIsPaymentModalOpen(false)}>{t('cancel')}</Button>
                  <Button onClick={handleSavePayment} variant="primary">
                    {editingPayment ? t('saveChanges') : t('newPayment')}
                  </Button>
                </div>
              </Card>
            </div>
          )}

          {/* 全垢幕圖片預覽燈箱 */}
          <ImagePreviewModal src={previewImage} onClose={() => setPreviewImage(null)} />

          {/* 訂閱 Modal */}
          {showSubscriptionModal && <SubscriptionModal />}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PropertyManagementSystem />);
  </script>
</body>

</html>
