  <!-- 5. Capacitor Bridge Helper -->
  <script>
    // Capacitor Bridge 初始化
    // 提供與原 Android.xxx() 相容的非同步 wrapper，供 React 元件使用
    window.CapBridge = {
      // 支援 Capacitor 原生環境 或 舊版 Android.xxx() 橋接
      isNative() {
        return !!(window.Capacitor && window.Capacitor.isNativePlatform()) ||
               !!(window.Android && typeof window.Android.isAndroidApp === 'function' && window.Android.isAndroidApp());
      },

      async getLanguage() {
        if (window.Android && typeof window.Android.getLanguage === 'function') return window.Android.getLanguage();
        return localStorage.getItem('app_language') || 'zh-TW';
      },

      async setLanguage(lang) {
        if (window.Android && typeof window.Android.setLanguage === 'function') window.Android.setLanguage(lang);
        localStorage.setItem('app_language', lang);
      },

      async downloadFile(fileName, base64Data) {
        // 舊版 Android 橋接（WebAppInterface.downloadFile → 存到 Downloads 資料夾）
        if (window.Android && typeof window.Android.downloadFile === 'function') {
          return window.Android.downloadFile(fileName, base64Data);
        }
        // Capacitor 橋接
        if (window.Capacitor && window.Capacitor.isNativePlatform()) {
          try {
            const { Filesystem, Share } = window.Capacitor.Plugins;
            const result = await Filesystem.writeFile({
              path: fileName,
              data: base64Data,
              directory: 'CACHE',
            });
            await Share.share({ title: fileName, url: result.uri, dialogTitle: '儲存或分享備份' });
            return 'success';
          } catch (e) {
            console.error('CapBridge.downloadFile error:', e);
            return 'error: ' + e.message;
          }
        }
        return 'not_native';
      },

      async shareFile(fileName, base64Data) {
        // 舊版 Android 橋接（WebAppInterface.shareFile → 開啟系統分享選單）
        if (window.Android && typeof window.Android.shareFile === 'function') {
          return window.Android.shareFile(fileName, base64Data);
        }
        return this.downloadFile(fileName, base64Data);
      },
    };
  </script>

    const compressImage = (file, maxWidth = 800, quality = 0.7) => {

        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = (maxWidth / w) * h; w = maxWidth; }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

    const OnboardingScreen = ({ language, darkMode, visible, onDone }) => {
      const [page, setPage] = React.useState(0);
      const [leaving, setLeaving] = React.useState(false);
      const [slideDir, setSlideDir] = React.useState(1); // 1=right→left, -1=left→right
      const [animating, setAnimating] = React.useState(false);

      const lang = ONBOARDING_SLIDES[language] ? language : 'zh-TW';
      const slides = ONBOARDING_SLIDES[lang];
      const total = slides.length;
      const slide = slides[page];
      const SlideIcon = slide.icon;

      const labels = {
        skip:  { 'zh-TW': '略過', en: 'Skip', ja: 'スキップ', ko: '건너뛰기' }[lang],
        next:  { 'zh-TW': '下一頁', en: 'Next', ja: '次へ', ko: '다음' }[lang],
        start: { 'zh-TW': '開始使用', en: 'Get Started', ja: '始める', ko: '시작하기' }[lang],
      };

      const goPage = (next) => {
        if (animating) return;
        setSlideDir(next > page ? 1 : -1);
        setAnimating(true);
        setTimeout(() => { setPage(next); setAnimating(false); }, 220);
      };

      const finish = () => {
        localStorage.setItem('rm_onboarding_done', '1');
        setLeaving(true);
        setTimeout(onDone, 400);
      };

      if (!visible) return null;

      return (
        <div
          className={`fixed inset-0 z-[9998] flex flex-col transition-opacity duration-400 ${leaving ? 'opacity-0 pointer-events-none' : 'opacity-100'} ${darkMode ? 'bg-slate-900' : 'bg-white'}`}
          style={{ paddingTop: 'env(safe-area-inset-top)', paddingBottom: 'env(safe-area-inset-bottom)' }}
        >
          {/* 略過按鈕 */}
          <div className="flex justify-end px-6 pt-4">
            <button
              onClick={finish}
              className={`text-sm font-medium px-3 py-1 rounded-full ${darkMode ? 'text-slate-400 hover:text-slate-200 hover:bg-slate-800' : 'text-slate-400 hover:text-slate-700 hover:bg-slate-100'} transition-colors`}
            >
              {labels.skip}
            </button>
          </div>

          {/* 主內容 */}
          <div className="flex-1 flex flex-col items-center justify-center px-8 text-center">
            <div
              className={`transition-all duration-220 ${animating ? (slideDir > 0 ? '-translate-x-8 opacity-0' : 'translate-x-8 opacity-0') : 'translate-x-0 opacity-100'}`}
            >
              {/* 圖示圓圈 */}
              <div className={`w-28 h-28 rounded-full flex items-center justify-center mx-auto mb-8 ${slide.bg}`}>
                <SlideIcon size={56} className={slide.fg} />
              </div>

              {/* 標題 */}
              <h2 className={`text-2xl font-bold mb-4 leading-snug ${darkMode ? 'text-white' : 'text-slate-800'}`}>
                {slide.title}
              </h2>

              {/* 說明 */}
              <p className={`text-base leading-relaxed max-w-xs mx-auto ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                {slide.desc}
              </p>
            </div>
          </div>

          {/* 底部：dots + 按鈕 */}
          <div className="px-8 pb-10 flex flex-col items-center gap-6">
            {/* Dots */}
            <div className="flex gap-2">
              {slides.map((_, i) => (
                <button
                  key={i}
                  onClick={() => goPage(i)}
                  className={`rounded-full transition-all duration-300 ${i === page
                    ? 'w-6 h-2.5 bg-indigo-500'
                    : `w-2.5 h-2.5 ${darkMode ? 'bg-slate-700' : 'bg-slate-200'}`
                  }`}
                />
              ))}
            </div>

            {/* 按鈕 */}
            <div className="w-full max-w-xs flex gap-3">
              {page > 0 && (
                <button
                  onClick={() => goPage(page - 1)}
                  className={`flex-1 py-3 rounded-xl font-medium text-sm transition-colors ${darkMode ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                >
                  ←
                </button>
              )}
              {page < total - 1 ? (
                <button
                  onClick={() => goPage(page + 1)}
                  className="flex-1 py-3 rounded-xl font-bold text-sm bg-indigo-600 text-white hover:bg-indigo-700 transition-colors shadow"
                >
                  {labels.next} →
                </button>
              ) : (
                <button
                  onClick={finish}
                  className="flex-1 py-3 rounded-xl font-bold text-sm bg-indigo-600 text-white hover:bg-indigo-700 transition-colors shadow"
                >
                  {labels.start}
                </button>
              )}
            </div>
          </div>
        </div>
      );
    };

    // 圖片上傳元件
    const ImageUploader = ({ label, imageIds = [], onUpload, onDelete, multiple = false, single = false }) => {
      const inputRef = useRef(null);
      const handleFile = async (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        for (const file of files) {
          if (!file.type.startsWith('image/')) { alert('請選擇圖片檔案'); continue; }
          try {
            const base64 = await compressImage(file);
            const id = saveImage(base64);
            onUpload(id);
          } catch (err) { console.error('圖片處理失敗', err); alert('圖片處理失敗'); }
        }
        e.target.value = '';
      };
      const ids = single ? (imageIds ? [imageIds] : []) : (imageIds || []);
      const validIds = ids.filter(Boolean);
      return (
        <div>
          <label className="block text-sm text-slate-600 mb-1">{label}</label>
          <div className="flex flex-wrap gap-2 mb-2">
            {validIds.map(id => {
              const src = getImage(id);
              return src ? (
                <div key={id} className="relative group w-20 h-20 rounded-lg overflow-hidden border border-slate-200">
                  <img src={src} className="w-full h-full object-cover cursor-pointer" onClick={() => window.__setPreviewImage && window.__setPreviewImage(src)} />
                  <button
                    onClick={() => onDelete(id)}
                    className="absolute top-0 right-0 bg-red-500 text-white rounded-bl p-0.5 opacity-0 group-hover:opacity-100 transition-opacity"
                  >
                    <Icons.X size={12} />
                  </button>
                </div>
              ) : null;
            })}
          </div>
          {(multiple || validIds.length === 0) && (
            <div>
              <input type="file" accept="image/*" ref={inputRef} onChange={handleFile} className="hidden" multiple={multiple} />
              <button
                type="button"
                onClick={() => inputRef.current.click()}
                className="flex items-center gap-2 px-3 py-2 border-2 border-dashed border-slate-300 rounded-lg text-sm text-slate-500 hover:bg-slate-50 hover:border-indigo-300 transition-all"
              >
                <Icons.Camera size={16} /> {validIds.length > 0 ? '新增更多' : '點擊上傳圖片'}
              </button>
            </div>
          )}
        </div>
      );
    };

      // 深淺色模式同步至 <html> class 與 localStorage
      useEffect(() => {

      }, [darkMode]);

      // Splash 自動消失（2.8 秒靜止 + 0.7 秒淡出）
      useEffect(() => {

      // 初始化讀取 LocalStorage (包含資料結構升級檢查)

        const savedContracts = localStorage.getItem('contracts');
        const savedPayments = localStorage.getItem('payments');

        if (savedProps) {
          const parsedProps = JSON.parse(savedProps);
          // 確保舊資料也有 repairs 陣列與 landlord
          const updatedProps = parsedProps.map(p => ({ repairs: [], landlord: '', ...p }));
          setProperties(updatedProps);
        }
        if (savedTenants) {
          const parsedTenants = JSON.parse(savedTenants);
          const updatedTenants = parsedTenants.map(t => ({ notes: '', idCardImage: null, contractImages: [], ...t }));
          setTenants(updatedTenants);
        }
        if (savedContracts) {
          const parsedContracts = JSON.parse(savedContracts);
          const loadedProps = savedProps ? JSON.parse(savedProps) : [];
          const loadedTenants = savedTenants ? JSON.parse(savedTenants) : [];
          const updatedContracts = parsedContracts.map(c => {
            const prop = loadedProps.find(p => idMatch(p.id, c.propertyId));

      // --- Actions: Property ---

      const openPropertyModal = (property = null) => {

        if (editingPropertyId) {
          // Update
          setProperties(properties.map(p => idMatch(p.id, editingPropertyId) ? { ...propertyForm, id: editingPropertyId, status: p.status, price: parseInt(propertyForm.price) || 0 } : p));

      // --- Actions: Batch Import Properties (Fixed for TXT/CSV) ---
      const handleBatchImportProperties = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // 判斷是否為文字檔 (CSV/TXT)
        const isText = file.name.toLowerCase().endsWith('.csv') || file.name.toLowerCase().endsWith('.txt');

        const reader = new FileReader();

        reader.onload = (evt) => {
          try {
            let workbook;
            if (isText) {
              // 文字檔使用 readAsText 讀取，確保文字編碼正確
              const data = evt.target.result;
              workbook = window.XLSX.read(data, { type: 'string' });
            } else {
              // Excel 檔使用二進位讀取
              const data = new Uint8Array(evt.target.result);
              workbook = window.XLSX.read(data, { type: 'array' });
            }

            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonData = window.XLSX.utils.sheet_to_json(worksheet);

            // 智慧映射邏輯 (支援中英文欄位名)
            const newProperties = jsonData.map(row => {
              const getVal = (keys) => {
                for (let k of Object.keys(row)) {
                  if (keys.some(key => k.includes(key))) return row[k];
                }
                return null;
              };

              const address = getVal(['地址', 'Address']) || '';
              const landlord = getVal(['房東', 'Landlord']) || '';
              const price = getVal(['租金', 'Rent', 'Price']) || 0;
              const type = getVal(['類型', 'Type']) || '公寓';
              // 若無名稱，預設使用地址
              const name = getVal(['名稱', 'Name', '房源名稱']) || address;

              if (!address) return null; // 若無地址則略過此行

              return {
                id: generateId(),
                name: String(name),
                address: String(address),
                price: Number(price) || 0,
                type: String(type),
                landlord: String(landlord),
                status: 'vacant',
                repairs: []
              };
            }).filter(p => p !== null);

            if (newProperties.length > 0) {
              if (window.confirm(translations[language].confirmBatchImport(newProperties.length))) {
                setProperties(prev => [...prev, ...newProperties]);
                alert(t('alertBatchImportSuccess'));
                setIsBatchImportModalOpen(false);
              }
            } else {
              alert(t('alertBatchImportFail'));
            }

          } catch (error) {
            console.error(error);
            alert(t('alertFileReadFail'));
          }
          e.target.value = ''; // Reset
        };

        // 依據檔案類型選擇讀取方式
        if (isText) {
          reader.readAsText(file);
        } else {
          reader.readAsArrayBuffer(file);
        }
      };

      // --- Actions: Repairs ---

      const handleAddRepair = () => {

      // --- 自動產生繳款單 ---
      const generatePaymentsForContract = (contract) => {
        const start = new Date(contract.startDate);
        const end = new Date(contract.endDate);
        if (isNaN(start) || isNaN(end) || start >= end) return [];

        const freq = contract.paymentFrequency || 'monthly';
        const cfg = contract.paymentDayConfig || {};
        const monthlyRent = contract.rentAmount;
        const dueDates = [];

        // 計算每期金額
        const amountMap = { monthly: monthlyRent, quarterly: monthlyRent * 3, 'semi-annual': monthlyRent * 6, annual: monthlyRent * 12 };
        const amount = amountMap[freq] || monthlyRent;

        // 月增量
        const monthStep = { monthly: 1, quarterly: 3, 'semi-annual': 6, annual: 12 };
        const step = monthStep[freq] || 1;

        if (freq === 'monthly') {
          // 月繳：每月指定日
          const day = cfg.dayOfMonth || 1;
          let cur = new Date(start.getFullYear(), start.getMonth(), day);
          if (cur < start) cur.setMonth(cur.getMonth() + 1);
          while (cur <= end) {
            // 處理有2月等沒有31日的情況
            const actualDay = Math.min(day, new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate());
            const dueDate = new Date(cur.getFullYear(), cur.getMonth(), actualDay);
            dueDates.push(dueDate.toISOString().split('T')[0]);
            cur.setMonth(cur.getMonth() + 1);
          }
        } else {
          // 季繳/半年繳/年繳
          const timing = cfg.timing || 'start';
          let periodStart = new Date(start);

          while (periodStart < end) {
            let periodEnd = new Date(periodStart);
            periodEnd.setMonth(periodEnd.getMonth() + step);
            periodEnd.setDate(periodEnd.getDate() - 1);
            if (periodEnd > end) periodEnd = new Date(end);

            let dueDate;
            if (timing === 'start') {
              dueDate = new Date(periodStart);
            } else if (timing === 'end') {
              dueDate = new Date(periodEnd);
            } else if (timing === 'custom' && cfg.customDate) {
              // 年繳指定日期 (MM-DD)
              const [mm, dd] = cfg.customDate.split('-').map(Number);
              dueDate = new Date(periodStart.getFullYear(), mm - 1, dd);
              if (dueDate < periodStart) dueDate = new Date(periodStart.getFullYear() + 1, mm - 1, dd);
              if (dueDate > end) break;
            } else {
              dueDate = new Date(periodStart);
            }

            if (dueDate >= start && dueDate <= end) {
              dueDates.push(dueDate.toISOString().split('T')[0]);
            }

            periodStart = new Date(periodStart);
            periodStart.setMonth(periodStart.getMonth() + step);
          }
        }

        return dueDates.map(d => ({
          id: generateId(),
          contractId: contract.id,
          dueDate: d,
          amount: amount,
          status: 'pending',
          paidDate: null,
          notes: '',
          proofImage: null
        }));
      };

      const handleCreateContract = () => {
        if (!newContract.propertyId || !newContract.tenantId || !newContract.startDate || !newContract.endDate) return alert(t('alertFillContract'));

        const selectedProp = properties.find(p => idMatch(p.id, newContract.propertyId));
        const selectedTenant = tenants.find(t => idMatch(t.id, newContract.tenantId));
        const rent = parseInt(newContract.rentAmount) || (selectedProp ? parseInt(selectedProp.price) : 0) || 0;
        const dep = parseInt(newContract.deposit) || rent * 2;
        const contract = {
          ...newContract,
          id: generateId(),
          status: 'active',
          rentAmount: rent,
          deposit: dep,
          propertyName: selectedProp?.name || t('unknownProp'),
          tenantName: selectedTenant?.name || t('unknownTenant')
        };
        setContracts([...contracts, contract]);

        // 自動產生繳款單
        const newPayments = generatePaymentsForContract(contract);
        if (newPayments.length > 0) {
          setPayments(prev => [...prev, ...newPayments]);
        }

        setProperties(properties.map(p =>
          idMatch(p.id, newContract.propertyId) ? { ...p, status: 'rented' } : p
        ));

        setNewContract({
          propertyId: '', tenantId: '', startDate: '', endDate: '',
          rentAmount: '', deposit: '', paymentMethod: '銀行轉帳',
          paymentFrequency: 'monthly', paymentDayConfig: { dayOfMonth: 1 }
        });
        setIsContractModalOpen(false);
        setActiveTab('payments');
      };

      const handleTerminateContract = (contractId, propertyId) => {
        if (window.confirm(t('confirmTerminateContract'))) {
          setContracts(contracts.map(c => idMatch(c.id, contractId) ? { ...c, status: 'expired' } : c));
          setProperties(properties.map(p => idMatch(p.id, propertyId) ? { ...p, status: 'vacant' } : p));
        }
      };

      // --- Actions: Payment ---

      // 計算兩個日期之間的天數差
      const getDaysRemaining = (dateStr) => {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(dateStr);
        const diffTime = target - today;
        return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      };

      // --- Actions: Payment ---

      // 開啟繳款 Modal（新增或編輯）
      const openPaymentModal = (payment = null) => {
        if (payment) {
          // 編輯模式
          setEditingPayment(payment.id);
          setPaymentForm({
            contractId: payment.contractId,
            dueDate: payment.dueDate,
            amount: payment.amount,
            status: payment.status,
            paidDate: payment.paidDate || '',
            notes: payment.notes || '',
            proofImage: payment.proofImage || null
          });
        } else {
          // 新增模式
          setEditingPayment(null);
          const today = new Date();
          const nextMonth = new Date(today.getFullYear(), today.getMonth() + 1, 1);
          setPaymentForm({
            contractId: contracts.length > 0 ? contracts[0].id : '',
            dueDate: nextMonth.toISOString().split('T')[0],
            amount: '',
            status: 'pending',
            paidDate: '',
            notes: '',
            proofImage: null
          });
        }
        setIsPaymentModalOpen(true);
      };

      // 儲存繳款（新增或更新）
      const handleSavePayment = () => {
        if (!paymentForm.contractId || !paymentForm.dueDate || !paymentForm.amount) {
          return alert(t('alertFillPayment'));
        }

        if (editingPayment) {
          setPayments(payments.map(p =>
            p.id === editingPayment
              ? {
                ...p,
                contractId: paymentForm.contractId,
                dueDate: paymentForm.dueDate,
                amount: parseInt(paymentForm.amount),
                status: paymentForm.status,
                paidDate: paymentForm.status === 'paid' ? (paymentForm.paidDate || new Date().toISOString().split('T')[0]) : null,
                notes: paymentForm.notes,
                proofImage: paymentForm.proofImage
              }
              : p
          ));
        } else {
          const newPayment = {
            id: generateId(),
            contractId: paymentForm.contractId,
            dueDate: paymentForm.dueDate,
            amount: parseInt(paymentForm.amount),
            status: paymentForm.status,
            paidDate: paymentForm.status === 'paid' ? (paymentForm.paidDate || new Date().toISOString().split('T')[0]) : null,
            notes: paymentForm.notes,
            proofImage: paymentForm.proofImage
          };
          setPayments([...payments, newPayment]);
        }

        setIsPaymentModalOpen(false);
        setEditingPayment(null);
      };

      const handleDeletePayment = (paymentId) => {
        if (window.confirm(t('confirmDeletePayment'))) {
          const payment = payments.find(p => p.id === paymentId);
          if (payment && payment.proofImage) deleteImage(payment.proofImage);
          setPayments(payments.filter(p => p.id !== paymentId));
        }
      };

      // 批次刪除繳款
      const handleBatchDeletePayments = (ids) => {
        if (!ids || ids.length === 0) return;
        if (window.confirm(translations[language].confirmBatchDeletePayments(ids.length))) {
          const paymentsToDelete = payments.filter(p => ids.includes(p.id));
          paymentsToDelete.forEach(p => {
            if (p.proofImage) deleteImage(p.proofImage);
          });
          setPayments(payments.filter(p => !ids.includes(p.id)));
          return true;
        }
        return false;
      };

      // 標記繳款已完成
      const handleMarkAsPaid = (paymentId) => {
        const today = new Date().toISOString().split('T')[0];
        setPayments(payments.map(p =>
          p.id === paymentId
            ? { ...p, status: 'paid', paidDate: today }
            : p
        ));
      };

      // 從合約生成下個月的繳款項目
      const generateNextPayment = (contract) => {
        // 找出此合約最後一筆繳款
        const contractPayments = payments.filter(p => p.contractId === contract.id);
        const sortedPayments = contractPayments.sort((a, b) => new Date(b.dueDate) - new Date(a.dueDate));

        let nextDueDate;
        if (sortedPayments.length > 0) {
          const lastDue = new Date(sortedPayments[0].dueDate);
          lastDue.setMonth(lastDue.getMonth() + 1);
          nextDueDate = lastDue.toISOString().split('T')[0];
        } else {
          // 如果沒有繳款紀錄，從合約開始日開始
          nextDueDate = contract.startDate;
        }

        // 檢查是否超過合約結束日
        if (nextDueDate > contract.endDate) {
          alert(t('alertContractExpired'));
          return;
        }

        const newPayment = {
          id: generateId(),
          contractId: contract.id,
          dueDate: nextDueDate,
          paidDate: null,
          amount: contract.rentAmount,
          status: 'pending',
          notes: ''
        };

        setPayments([...payments, newPayment]);
        alert(translations[language].alertPaymentAdded(nextDueDate));
      };

      // 取得合約到期天數
      const getContractDaysRemaining = (endDate) => getDaysRemaining(endDate);

      // 續約合約並自動產生繳款
      const handleRenewContract = (contractId, months = 12) => {
        const contract = contracts.find(c => idMatch(c.id, contractId));
        if (!contract) return;

        const oldEndDateStr = contract.endDate;
        const newEndDate = new Date(oldEndDateStr);
        newEndDate.setMonth(newEndDate.getMonth() + months);
        const newEndDateStr = newEndDate.toISOString().split('T')[0];

        // 1. 更新合約日期與狀態
        setContracts(contracts.map(c =>
          idMatch(c.id, contractId) ? { ...c, endDate: newEndDateStr, status: 'active' } : c
        ));

        // 2. 自動產生續約期間的繳款紀錄
        const newPayments = [];
        let currentDate = new Date(oldEndDateStr);
        const step = contract.paymentFrequency === 'quarterly' ? 3 :
          contract.paymentFrequency === 'semi-annual' ? 6 :
            contract.paymentFrequency === 'annual' ? 12 : 1;

        while (true) {
          currentDate.setMonth(currentDate.getMonth() + step);
          const dueDate = currentDate.toISOString().split('T')[0];
          if (dueDate > newEndDateStr) break;

          newPayments.push({
            id: generateId(),
            contractId: contract.id,
            dueDate: dueDate,
            paidDate: null,
            amount: contract.rentAmount,
            status: 'pending',
            notes: '',
            proofImage: null
          });
        }

        if (newPayments.length > 0) {
          setPayments(prev => [...prev, ...newPayments]);
        }

        const msg = language === 'en'
          ? `Contract renewed for ${months} months! (${newPayments.length} payments generated)`
          : `合約已續約 ${months} 個月！（已自動產生 ${newPayments.length} 筆繳款紀錄）`;
        alert(msg);
      };

      // --- Excel & Share ---
      const generateWorkbook = () => {
        if (!window.XLSX) { alert(t('alertExcelInit')); return null; }
        const wb = window.XLSX.utils.book_new();

        // 房源資料：只匯出必要欄位，排除 repairs 陣列和圖片
        const exportProps = properties.map(p => ({
          id: String(p.id),
          name: p.name || '',
          address: p.address || '',
          price: Number(p.price) || 0,
          type: p.type || '公寓',
          status: p.status || 'vacant',
          landlord: p.landlord || '',
          repairsCount: (p.repairs || []).length,
          totalRepairCost: (p.repairs || []).reduce((sum, r) => sum + (Number(r.cost) || 0), 0)
        }));

        // 租客資料：排除圖片欄位
        const exportTenants = tenants.map(t => ({
          id: String(t.id),
          name: t.name || '',
          phone: t.phone || '',
          email: t.email || '',
          idCard: t.idCard || '',
          notes: t.notes || ''
        }));

        // 租約資料：包含房源/租客名稱方便閱讀
        const exportContracts = contracts.map(c => {
          const prop = properties.find(p => idMatch(p.id, c.propertyId));
          const tenant = tenants.find(t => idMatch(t.id, c.tenantId));
          return {
            id: String(c.id),
            propertyId: String(c.propertyId),
            propertyName: prop?.name || c.propertyName || '',
            tenantId: String(c.tenantId),
            tenantName: tenant?.name || c.tenantName || '',
            startDate: c.startDate || '',
            endDate: c.endDate || '',
            rentAmount: Number(c.rentAmount) || 0,
            deposit: Number(c.deposit) || 0,
            paymentMethod: c.paymentMethod || '銀行轉帳',
            paymentFrequency: c.paymentFrequency || 'monthly',
            status: c.status || 'active'
          };
        });

        // 繳款紀錄：排除圖片欄位
        const exportPayments = payments.map(p => ({
          id: String(p.id),
          contractId: String(p.contractId),
          dueDate: p.dueDate || '',
          amount: Number(p.amount) || 0,
          status: p.status || 'pending',
          paidDate: p.paidDate || '',
          notes: p.notes || ''
        }));

        const wsProperties = window.XLSX.utils.json_to_sheet(exportProps);
        const wsTenants = window.XLSX.utils.json_to_sheet(exportTenants);
        const wsContracts = window.XLSX.utils.json_to_sheet(exportContracts);
        const wsPayments = window.XLSX.utils.json_to_sheet(exportPayments);

        window.XLSX.utils.book_append_sheet(wb, wsProperties, "房源資料");
        window.XLSX.utils.book_append_sheet(wb, wsTenants, "租客資料");
        window.XLSX.utils.book_append_sheet(wb, wsContracts, "租約資料");
        window.XLSX.utils.book_append_sheet(wb, wsPayments, "繳款紀錄");
        return wb;
      };

      // 原生下載輔助函數（Capacitor）
      const androidDownload = async (wb, fileName) => {
        const wbout = window.XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
        const result = await window.CapBridge.downloadFile(fileName, wbout);
        return result === 'success';
      };

      // 切換分頁 (帶廣告)
      const handleTabChange = (newTab) => {
        if (newTab === activeTab) return;

        // 廣告預留位置（AD_ENABLED=false，暫不實作）
        // if (window.Capacitor?.isNativePlatform()) { /* AdMob 第二版 */ }

        setActiveTab(newTab);
      };

      const handleExportDownload = async () => {
        const wb = generateWorkbook();
        if (!wb) return;
        const dateStr = new Date().toISOString().split('T')[0];
        const fileName = `房管系統備份_${dateStr}.xlsx`;

        // 原生環境使用 Capacitor 下載，瀏覽器 fallback
        if (window.CapBridge.isNative()) {
          try {
            if (await androidDownload(wb, fileName)) return;
          } catch (e) { console.error('CapBridge download error:', e); }
        }

        // Fallback: 瀏覽器下載
        window.XLSX.writeFile(wb, fileName);
      };

      // 核心功能：產生 Excel 並喚起系統分享選單
      const handleSmartShare = async () => {
        const wb = generateWorkbook();
        if (!wb) return;

        const dateStr = new Date().toISOString().split('T')[0];
        const fileName = `房管系統備份_${dateStr}.xlsx`;

        if (window.CapBridge.isNative()) {
          // 原生環境（Android / iOS）：走 Android 橋接或 Capacitor 分享
          try {
            const wbBase64 = window.XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
            const result = await window.CapBridge.shareFile(fileName, wbBase64);
            if (result !== 'success') {
              alert(translations[language].alertShareFailAndroid(result));
            }
          } catch (e) {
            console.error('CapBridge share error:', e);
            alert(t('alertRetry'));
          }
        } else {
          // 瀏覽器環境
          const wbout = window.XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
          const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          const file = new File([blob], fileName, { type: blob.type });

          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({ files: [file], title: t('backupTitle'), text: translations[language].backupText(dateStr) });
            } catch (error) {
              if (error.name !== 'AbortError') {
                window.XLSX.writeFile(wb, fileName);
              }
            }
          } else {
            // 電腦版 Fallback：自動下載 + 開啟網頁
            alert(t('exportPcMsg'));
            window.XLSX.writeFile(wb, fileName);
            setTimeout(() => {
              const choice = window.confirm(t('confirmOpenLine'));
              if (choice) window.open('https://line.me', '_blank');
              else window.open('https://drive.google.com/drive/my-drive', '_blank');
            }, 1000);
          }
        }
      };

      const handleImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = window.XLSX.read(data, { type: 'array' });
            const sheetNames = workbook.SheetNames;
            let newProps = null, newTenants = null, newContracts = null, newPayments = null;

            if (sheetNames.includes("房源資料")) newProps = window.XLSX.utils.sheet_to_json(workbook.Sheets["房源資料"]);
            if (sheetNames.includes("租客資料")) newTenants = window.XLSX.utils.sheet_to_json(workbook.Sheets["租客資料"]);
            if (sheetNames.includes("租約資料")) newContracts = window.XLSX.utils.sheet_to_json(workbook.Sheets["租約資料"]);
            if (sheetNames.includes("繳款紀錄")) newPayments = window.XLSX.utils.sheet_to_json(workbook.Sheets["繳款紀錄"]);

            // 統計摘要
            const summary = [];
            if (newProps) summary.push(translations[language].importSummaryProp(newProps.length));
            if (newTenants) summary.push(translations[language].importSummaryTenant(newTenants.length));
            if (newContracts) summary.push(translations[language].importSummaryContract(newContracts.length));
            if (newPayments && newPayments.length > 0) summary.push(translations[language].importSummaryPayment(newPayments.length));

            if (summary.length === 0) {
              alert(t('alertImportNoSheet'));
              return;
            }

            if (window.confirm(translations[language].confirmImport(summary.join(', ')))) {
              // 匯入房源 — 確保正確資料格式
              if (newProps) {
                const cleanProps = newProps.map(p => ({
                  id: String(p.id || generateId()),
                  name: String(p.name || ''),
                  address: String(p.address || ''),
                  price: Number(p.price) || 0,
                  type: String(p.type || '公寓'),
                  status: String(p.status || 'vacant'),
                  landlord: String(p.landlord || ''),
                  repairs: Array.isArray(p.repairs) ? p.repairs : []
                }));
                setProperties(cleanProps);
              }

              // 匯入租客 — 保留圖片欄位預設值
              if (newTenants) {
                const cleanTenants = newTenants.map(t => ({
                  id: String(t.id || generateId()),
                  name: String(t.name || ''),
                  phone: String(t.phone || ''),
                  email: String(t.email || ''),
                  idCard: String(t.idCard || ''),
                  notes: String(t.notes || ''),
                  idCardImage: null,
                  contractImages: []
                }));
                setTenants(cleanTenants);
              }

              // 匯入合約 — 交叉引用名稱
              if (newContracts) {
                const propsRef = newProps || properties;
                const tenantsRef = newTenants || tenants;
                const cleanContracts = newContracts.map(c => {
                  const prop = propsRef.find(p => idMatch(p.id, c.propertyId));
                  const tenant = tenantsRef.find(t => idMatch(t.id, c.tenantId));
                  return {
                    id: String(c.id || generateId()),
                    propertyId: String(c.propertyId || ''),
                    tenantId: String(c.tenantId || ''),
                    startDate: String(c.startDate || ''),
                    endDate: String(c.endDate || ''),
                    rentAmount: Number(c.rentAmount) || 0,
                    deposit: Number(c.deposit) || 0,
                    paymentMethod: String(c.paymentMethod || '銀行轉帳'),
                    paymentFrequency: String(c.paymentFrequency || 'monthly'),
                    paymentDayConfig: c.paymentDayConfig || { dayOfMonth: 1 },
                    status: String(c.status || 'active'),
                    propertyName: c.propertyName || prop?.name || t('unknownProp'),
                    tenantName: c.tenantName || tenant?.name || t('unknownTenant')
                  };
                });
                setContracts(cleanContracts);
              }

              // 匯入繳款
              if (newPayments && newPayments.length > 0) {
                const cleanPayments = newPayments.map(p => ({
                  id: String(p.id || generateId()),
                  contractId: String(p.contractId || ''),
                  dueDate: String(p.dueDate || ''),
                  amount: Number(p.amount) || 0,
                  status: String(p.status || 'pending'),
                  paidDate: p.paidDate ? String(p.paidDate) : null,
                  notes: String(p.notes || ''),
                  proofImage: null
                }));
                setPayments(cleanPayments);
              }

              alert(translations[language].alertImportSuccess(newPayments && newPayments.length > 0 ? '' : t('alertImportSuccessHint')));
            }
          } catch (err) {
            console.error('匯入錯誤:', err);
            alert(translations[language].alertImportFail(err.message || t('alertImportFileFail')));
          }
          e.target.value = '';
        };
        reader.readAsArrayBuffer(file);
      };

      const triggerFileInput = () => fileInputRef.current.click();
      const triggerBatchImport = () => batchFileInputRef.current.click();

      // --- Views ---

      const DashboardView = () => {
        const totalProps = properties.length;
        const rentedProps = properties.filter(p => p.status === 'rented').length;
        const vacantProps = properties.filter(p => p.status === 'vacant').length;
        const occupancyRate = totalProps > 0 ? Math.round((rentedProps / totalProps) * 100) : 0;
        const totalRevenue = contracts
          .filter(c => c.status === 'active')
          .reduce((acc, curr) => acc + curr.rentAmount, 0);

        // 計算待繳款項
        const pendingPayments = payments.filter(p => p.status === 'pending');
        const overduePayments = payments.filter(p => p.status === 'overdue');
        const pendingAmount = pendingPayments.reduce((sum, p) => sum + p.amount, 0);

        // 計算即將到期合約 (30天內)
        const expiringContracts = contracts.filter(c => {
          if (c.status !== 'active') return false;
          const days = getDaysRemaining(c.endDate);
          return days >= 0 && days <= 30;
        });

        return (
          <div className="space-y-6 animate-fadeIn">
            {/* 基本統計 */}
            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
              <Card className="p-6 border-l-4 border-indigo-500">
                <div className="text-slate-500 text-sm font-medium">{t('totalProperties')}</div>
                <div className="text-3xl font-bold text-slate-800 mt-1">{totalProps} <span className="text-sm font-normal text-slate-400">{t('unit')}</span></div>
              </Card>
              <Card className="p-6 border-l-4 border-green-500">
                <div className="text-slate-500 text-sm font-medium">{t('occupancyRate')}</div>
                <div className="text-3xl font-bold text-slate-800 mt-1">{occupancyRate}%</div>
              </Card>
              <Card className="p-6 border-l-4 border-blue-500">
                <div className="text-slate-500 text-sm font-medium">{t('vacantUnits')}</div>
                <div className="text-3xl font-bold text-slate-800 mt-1">{vacantProps} <span className="text-sm font-normal text-slate-400">{t('unit')}</span></div>
              </Card>
              <Card className="p-6 border-l-4 border-yellow-500">
                <div className="text-slate-500 text-sm font-medium">{t('estimatedIncome')}</div>
                <div className="text-3xl font-bold text-slate-800 mt-1">${totalRevenue.toLocaleString()}</div>
              </Card>
            </div>

            {/* 繳款與合約提醒 */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {/* 繳款提醒卡片 */}
              <Card className="p-6">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                    <Icons.DollarSign size={20} className="text-green-600" />
                    {t('paymentStatus')}
                  </h3>
                  <Button variant="secondary" className="text-sm py-1" onClick={() => setActiveTab('payments')}>
                    {t('viewAll')}
                  </Button>
                </div>

                <div className="space-y-3">
                  <div className="flex justify-between items-center p-3 bg-yellow-50 rounded-lg">
                    <div className="flex items-center gap-2">
                      <Icons.Clock size={18} className="text-yellow-600" />
                      <span className="text-yellow-800">{t('pendingPayments')}</span>
                    </div>
                    <div className="text-right">
                      <div className="font-bold text-yellow-700">{pendingPayments.length}</div>
                      <div className="text-xs text-yellow-600">${pendingAmount.toLocaleString()}</div>
                    </div>
                  </div>

                  {overduePayments.length > 0 && (
                    <div className="flex justify-between items-center p-3 bg-red-50 rounded-lg">
                      <div className="flex items-center gap-2">
                        <Icons.AlertTriangle size={18} className="text-red-600" />
                        <span className="text-red-800">{t('overduePayments')}</span>
                      </div>
                      <div className="text-right">
                        <div className="font-bold text-red-700">{overduePayments.length}</div>
                        <div className="text-xs text-red-600">${overduePayments.reduce((sum, p) => sum + p.amount, 0).toLocaleString()}</div>
                      </div>
                    </div>
                  )}

                  {pendingPayments.length === 0 && overduePayments.length === 0 && (
                    <div className="text-center text-slate-400 py-4">
                      <Icons.Check size={24} className="mx-auto mb-2 text-green-500" />
                      {t('allPaidMsg')}
                    </div>
                  )}
                </div>
              </Card>

              {/* 合約到期提醒 */}
              <Card className="p-6">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                    <Icons.Calendar size={20} className="text-orange-600" />
                    {t('contractExpiry')}
                  </h3>
                  <Button variant="secondary" className="text-sm py-1" onClick={() => setActiveTab('contracts')}>
                    {t('viewAll')}
                  </Button>
                </div>

                {expiringContracts.length > 0 ? (
                  <div className="space-y-3">
                    {expiringContracts.slice(0, 3).map(contract => {
                      const prop = properties.find(p => p.id === contract.propertyId);
                      const days = getDaysRemaining(contract.endDate);

                      return (
                        <div key={contract.id} className="flex justify-between items-center p-3 bg-orange-50 rounded-lg">
                          <div>
                            <div className="font-medium text-orange-800">{prop?.name || contract.propertyName || t('unknownProp')}</div>
                            <div className="text-xs text-orange-600">{contract.endDate}</div>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className={`px-2 py-1 rounded text-xs font-bold ${days <= 7 ? 'bg-red-100 text-red-700' : 'bg-orange-100 text-orange-700'}`}>
                              {t('daysRemaining')} {days} {t('days')}
                            </span>
                            <Button
                              variant="secondary"
                              className="text-xs py-1 px-2"
                              onClick={() => handleRenewContract(contract.id)}
                            >
                              {t('renew')}
                            </Button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                ) : (
                  <div className="text-center text-slate-400 py-4">
                    <Icons.Check size={24} className="mx-auto mb-2 text-green-500" />
                    {t('noExpiringContracts')}
                  </div>
                )}
              </Card>
            </div>
          </div>
        );
      };

      const PropertyListView = () => (
        <div className="space-y-6 animate-fadeIn">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold text-slate-800">{t('propertiesTitle')}</h2>
            <div className="flex gap-2">
              <Button onClick={() => setIsBatchImportModalOpen(true)} variant="secondary" icon={Icons.FileUp}>{t('batchImport')}</Button>
              <Button onClick={() => openPropertyModal()} icon={Icons.Plus}>{t('newProperty')}</Button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {properties.map(item => {
              const totalRepairCost = item.repairs?.reduce((sum, r) => sum + (r.cost || 0), 0) || 0;

              return (
                <Card key={item.id} className="overflow-hidden hover:shadow-md transition-shadow relative group">
                  <div className="h-2 bg-indigo-600"></div>
                  <div className="p-5">
                    <div className="flex justify-between items-start mb-2">
                      <Badge status={item.status} />
                      <span className="text-xs font-bold text-slate-400 border border-slate-200 px-2 py-1 rounded">{item.type}</span>
                    </div>
                    <h3 className="font-bold text-lg text-slate-800 mb-1">{item.name}</h3>
                    <p className="text-sm text-slate-500 mb-1 flex items-center gap-1">
                      {item.address}
                    </p>
                    {/* 顯示房東姓名 */}
                    {item.landlord && (
                      <p className="text-sm text-slate-500 mb-3 flex items-center gap-1">
                        <Icons.User size={14} className="text-slate-400" /> {t('landlordLabel')}{item.landlord}
                      </p>
                    )}

                    {/* 修繕摘要 */}
                    {totalRepairCost > 0 && (
                      <div className="mb-4 text-xs bg-orange-50 text-orange-700 p-2 rounded flex items-center gap-1">
                        <Icons.Wrench size={12} /> {t('repairsLabel')}${totalRepairCost.toLocaleString()}
                      </div>
                    )}

                    {!totalRepairCost && <div className="mb-4 h-8"></div>}

                    <div className="flex justify-between items-end border-t pt-4">
                      <div>
                        <div className="text-xs text-slate-400">{t('monthlyRent')}</div>
                        <div className="text-xl font-bold text-indigo-600">${item.price.toLocaleString()}</div>
                      </div>
                      <div className="flex gap-2">
                        <Button variant="icon" onClick={() => openPropertyModal(item)} title={t('editRepairTitle')}>
                          <Icons.Edit size={18} />
                        </Button>
                        <Button variant="icon" onClick={() => handleDeleteProperty(item.id)} className="hover:text-red-500" title={t('deleteTitle')}>
                          <Icons.Trash2 size={18} />
                        </Button>
                      </div>
                    </div>
                  </div>
                </Card>
              );
            })}
          </div>
        </div>
      );

      const TenantListView = () => (
        <div className="space-y-6 animate-fadeIn">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold text-slate-800">{t('tenantsTitle')}</h2>
            <Button onClick={() => openTenantModal()} icon={Icons.Plus}>{t('newTenant')}</Button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {tenants.map(tenant => (
              <Card key={tenant.id} className="p-5 hover:shadow-md transition-shadow">
                <div className="flex justify-between items-start">
                  <div>
                    <h3 className="font-bold text-lg text-slate-800">
                      {tenant.name}
                      {(tenant.idCardImage || (tenant.contractImages && tenant.contractImages.length > 0)) && (
                        <Icons.Paperclip size={14} className="inline ml-1 text-indigo-400" />
                      )}
                    </h3>
                    <div className="text-slate-500 text-sm mt-1 flex flex-col gap-1">
                      <span>📞 {tenant.phone}</span>
                      <span>📧 {tenant.email || t('noEmail')}</span>
                    </div>
                  </div>
                  <div className="flex gap-1">
                    <Button variant="icon" onClick={() => openTenantModal(tenant)}>
                      <Icons.Edit size={18} />
                    </Button>
                    <Button variant="icon" onClick={() => handleDeleteTenant(tenant.id)} className="hover:text-red-500">
                      <Icons.Trash2 size={18} />
                    </Button>
                  </div>
                </div>
                {/* 圖片縮圖區 */}
                <div className="flex flex-wrap gap-3 mt-2">
                  <ImageThumbnails imageIds={tenant.idCardImage} single={true} label="🆔" />
                  <ImageThumbnails imageIds={tenant.contractImages} label="📄" />
                </div>
                {tenant.notes && (
                  <div className="mt-4 pt-3 border-t text-sm text-slate-600 bg-slate-50 p-2 rounded whitespace-pre-wrap">
                    <span className="text-xs text-slate-400 block mb-1">{t('notesLabel')}</span>
                    {tenant.notes}
                  </div>
                )}
              </Card>
            ))}
            {tenants.length === 0 && <div className="col-span-2 text-center text-slate-400 py-10">{t('noTenants')}</div>}
          </div>
        </div>
      );

      const ContractListView = () => (
        <div className="space-y-6 animate-fadeIn">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold text-slate-800">{t('contractsTitle')}</h2>
            <Button onClick={() => setIsContractModalOpen(true)} icon={Icons.FileText} variant="success">{t('newContract')}</Button>
          </div>

          <div className="space-y-4">
            {contracts.map(contract => {
              const prop = properties.find(p => idMatch(p.id, contract.propertyId));
              const tenant = tenants.find(tn => idMatch(tn.id, contract.tenantId));
              const daysRemaining = getDaysRemaining(contract.endDate);
              const isExpiring = contract.status === 'active' && daysRemaining >= 0 && daysRemaining <= 30;
              const isExpired = daysRemaining < 0;

              return (
                <Card key={contract.id} className={`p-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 ${isExpiring ? 'border-l-4 border-orange-500' : ''}`}>
                  <div className="flex items-start gap-4">
                    <div className={`p-3 rounded-lg ${contract.status === 'active' ? 'bg-green-100 text-green-600' : 'bg-slate-100 text-slate-500'}`}>
                      <Icons.FileText size={24} />
                    </div>
                    <div>
                      <div className="flex items-center gap-2 mb-1 flex-wrap">
                        <h3 className="font-bold text-slate-800">{prop?.name || contract.propertyName || t('unknownProp')}</h3>
                        <Badge status={contract.status} />
                        {/* 到期倒數標籤 */}
                        {contract.status === 'active' && !isExpired && (
                          <span className={`px-2 py-0.5 rounded text-xs font-bold ${daysRemaining <= 7 ? 'bg-red-100 text-red-700' :
                            daysRemaining <= 30 ? 'bg-orange-100 text-orange-700' :
                              'bg-slate-100 text-slate-600'
                            }`}>
                            <Icons.Clock size={10} className="inline mr-1" />
                            {t('daysRemaining')} {daysRemaining} {t('days')}
                          </span>
                        )}
                      </div>
                      <div className="text-sm text-slate-500 mb-1">{t('tenantLabel')}<span className="font-medium text-slate-700">{tenant?.name || contract.tenantName || t('unknown')}</span> {tenant?.phone && `(${tenant.phone})`}</div>
                      <div className="text-xs text-slate-400 flex flex-wrap items-center gap-3">
                        <span className="flex items-center gap-1"><Icons.Calendar size={12} /> {contract.startDate} ~ {contract.endDate}</span>
                        <span className="flex items-center gap-1 bg-slate-100 px-2 py-0.5 rounded text-slate-600"><Icons.CreditCard size={12} /> {contract.paymentMethod || t('defaultPayMethod')}</span>
                        <span className="flex items-center gap-1 bg-indigo-50 px-2 py-0.5 rounded text-indigo-600">
                          <Icons.Clock size={12} /> {{ monthly: language === 'en' ? 'Monthly' : '月繳', quarterly: language === 'en' ? 'Quarterly' : '季繳', 'semi-annual': language === 'en' ? 'Semi-Annual' : '半年繳', annual: language === 'en' ? 'Annual' : '年繳' }[contract.paymentFrequency] || (language === 'en' ? 'Monthly' : '月繳')}
                        </span>
                      </div>
                      {/* 合約影本縮圖（從租客資料讀取） */}
                      {tenant && tenant.contractImages && tenant.contractImages.length > 0 && (
                        <div className="mt-1">
                          <ImageThumbnails imageIds={tenant.contractImages} label={t('contractCopyLabel')} />
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end border-t md:border-0 pt-4 md:pt-0">
                    <div className="text-right">
                      <div className="text-xs text-slate-400">{t('monthlyRent')}</div>
                      <div className="font-bold text-slate-700">${(contract.rentAmount || 0).toLocaleString()}</div>
                    </div>
                    <div className="flex gap-2">
                      {contract.status === 'active' && (
                        <>
                          <Button
                            variant="secondary"
                            className="text-sm px-3 py-1"
                            icon={Icons.RefreshCw}
                            onClick={() => handleRenewContract(contract.id)}
                          >
                            {t('renew')}
                          </Button>
                          <Button variant="danger" className="text-sm px-3 py-1" onClick={() => handleTerminateContract(contract.id, contract.propertyId)}>
                            {t('terminate')}
                          </Button>
                        </>
                      )}
                    </div>
                  </div>
                </Card>
              );
            })}
            {contracts.length === 0 && <div className="text-center py-12 text-slate-400 bg-white rounded-xl border border-dashed">{t('noContracts')}</div>}
          </div>
        </div>
      );

      // 繳款追蹤頁面（合約樹狀結構）
      const PaymentListView = () => {
        const [selectedIds, setSelectedIds] = useState([]);

        // 切換選取
        const toggleSelect = (id) => {
          setSelectedIds(prev =>
            prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]
          );
        };

        // 執行批次刪除
        const handleBatchDelete = () => {
          if (handleBatchDeletePayments(selectedIds)) {
            setSelectedIds([]);
          }
        };

        // 切換摺疊
        const toggleContract = (contractId) => {
          setExpandedContracts(prev => ({
            ...prev,
            [contractId]: !prev[contractId]
          }));
        };

        // 全部展開/摺疊
        const toggleAll = () => {
          const allExpanded = Object.values(expandedContracts).filter(Boolean).length === contracts.length;
          const next = {};
          contracts.forEach(c => { next[c.id] = !allExpanded; });
          setExpandedContracts(next);
        };

        // 取得合約資訊
        const getContractInfo = (contractId) => {
          const contract = contracts.find(c => idMatch(c.id, contractId));
          if (!contract) return { propName: t('unknown'), tenantName: t('unknown') };
          const prop = properties.find(p => idMatch(p.id, contract.propertyId));
          const tenant = tenants.find(tn => idMatch(tn.id, contract.tenantId));
          return {
            propName: prop?.name || contract.propertyName || t('unknownProp'),
            tenantName: tenant?.name || contract.tenantName || t('unknownTenant'),
            contract
          };
        };


        // 依合約分組
        const paymentsByContract = {};
        const orphanPayments = [];
        payments.forEach(p => {
          if (p.contractId && contracts.find(c => c.id === p.contractId)) {
            if (!paymentsByContract[p.contractId]) paymentsByContract[p.contractId] = [];
            paymentsByContract[p.contractId].push(p);
          } else {
            orphanPayments.push(p);
          }
        });

        // 排序每組繳款（按日期）
        Object.values(paymentsByContract).forEach(arr => arr.sort((a, b) => a.dueDate.localeCompare(b.dueDate)));

        // 取得當月繳款數據（日曆用）
        const getMonthPayments = () => {
          const year = calendarMonth.getFullYear();
          const month = calendarMonth.getMonth();
          return payments.filter(p => {
            const d = new Date(p.dueDate);
            return d.getFullYear() === year && d.getMonth() === month;
          });
        };

        // 繳款項目渲染
        const PaymentItem = ({ payment }) => {
          const { propName, tenantName } = getContractInfo(payment.contractId);
          const statusStyles = {
            paid: { bg: 'bg-green-50', border: 'border-green-200', icon: <Icons.Check className="text-green-600" size={18} />, text: 'text-green-700' },
            pending: { bg: 'bg-yellow-50', border: 'border-yellow-200', icon: <Icons.Clock className="text-yellow-600" size={18} />, text: 'text-yellow-700' },
            overdue: { bg: 'bg-red-50', border: 'border-red-200', icon: <Icons.AlertTriangle className="text-red-600" size={18} />, text: 'text-red-700' }
          };
          const style = statusStyles[payment.status];

          return (
            <div className={`p-3 rounded-lg ${style.bg} border ${style.border} flex justify-between items-center transition-all ${selectedIds.includes(payment.id) ? 'ring-2 ring-indigo-400' : ''}`}>
              <div className="flex items-center gap-3">
                <input
                  type="checkbox"
                  className="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 cursor-pointer"
                  checked={selectedIds.includes(payment.id)}
                  onChange={() => toggleSelect(payment.id)}
                />
                <div>{style.icon}</div>
                <div>
                  <div className="text-sm font-medium text-slate-700">
                    {t('dueDate')}: {payment.dueDate}
                    {payment.paidDate && <span className="ml-2 text-green-600">• {t('paidOn')} {payment.paidDate}</span>}
                  </div>
                  {payment.notes && <div className="text-xs text-slate-500 mt-0.5 italic">{payment.notes}</div>}
                  <ImageThumbnails imageIds={payment.proofImage} single={true} label="📃" />
                </div>
              </div>
              <div className="flex items-center gap-2">
                <div className={`font-bold ${style.text}`}>${payment.amount.toLocaleString()}</div>
                <div className="flex gap-1">
                  {(payment.status === 'pending' || payment.status === 'overdue') && (
                    <Button
                      variant="success"
                      className="text-xs px-2 py-1"
                      onClick={() => handleMarkAsPaid(payment.id)}
                    >
                      ✓ {t('markPaid')}
                    </Button>
                  )}
                  <Button
                    variant="icon"
                    className="text-xs"
                    onClick={() => openPaymentModal(payment)}
                  >
                    <Icons.Edit size={14} />
                  </Button>
                  <Button
                    variant="icon"
                    className="text-xs text-red-400"
                    onClick={() => { if (window.confirm(t('confirmDelete'))) handleDeletePayment(payment.id); }}
                  >
                    <Icons.Trash2 size={14} />
                  </Button>
                </div>
              </div>
            </div>
          );
        };

        // 合約繳款卡片
        const ContractPaymentGroup = ({ contractId, contractPayments }) => {
          const info = getContractInfo(contractId);
          const contract = info.contract;
          const isExpanded = expandedContracts[contractId] !== false; // 預設展開

          const overdue = contractPayments.filter(p => p.status === 'overdue').length;
          const pending = contractPayments.filter(p => p.status === 'pending').length;
          const paid = contractPayments.filter(p => p.status === 'paid').length;

          return (
            <Card className="overflow-hidden">
              {/* 合約標題列 —— 點擊摺疊 */}
              <div
                className="p-4 bg-gradient-to-r from-indigo-50 to-white cursor-pointer flex justify-between items-center hover:from-indigo-100 transition-all"
                onClick={() => toggleContract(contractId)}
              >
                <div className="flex items-center gap-3">
                  <div className="p-2 bg-indigo-100 rounded-lg">
                    <Icons.FileText size={20} className="text-indigo-600" />
                  </div>
                  <div>
                    <div className="font-bold text-slate-800">{info.propName}</div>
                    <div className="text-xs text-slate-500">
                      {t('tenantLabel')}{info.tenantName}
                      {contract && <span className="ml-2 px-1.5 py-0.5 bg-indigo-100 text-indigo-600 rounded text-xs">{freqLabel(contract.paymentFrequency)}</span>}
                    </div>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  {/* 狀態摘要 */}
                  <div className="flex gap-1.5 text-xs">
                    {overdue > 0 && <span className="px-2 py-0.5 bg-red-100 text-red-700 rounded-full font-medium">{t('overdueStatus')} {overdue}</span>}
                    {pending > 0 && <span className="px-2 py-0.5 bg-yellow-100 text-yellow-700 rounded-full font-medium">{t('pendingStatus')} {pending}</span>}
                    {paid > 0 && <span className="px-2 py-0.5 bg-green-100 text-green-700 rounded-full font-medium">{t('paidStatus')} {paid}</span>}
                  </div>
                  <Icons.ChevronDown
                    size={18}
                    className={`text-slate-400 transition-transform ${isExpanded ? 'rotate-180' : ''}`}
                  />
                </div>
              </div>

              {/* 展開的繳款列表 */}
              {isExpanded && (
                <div className="p-3 space-y-2 border-t bg-slate-50/50">
                  {contractPayments.map(p => <PaymentItem key={p.id} payment={p} />)}
                </div>
              )}
            </Card>
          );
        };

        // 日曆視圖
        const CalendarView = () => {
          const monthPayments = getMonthPayments();
          const year = calendarMonth.getFullYear();
          const month = calendarMonth.getMonth();
          const firstDay = new Date(year, month, 1).getDay();
          const daysInMonth = new Date(year, month + 1, 0).getDate();

          const days = [];
          for (let i = 0; i < firstDay; i++) {
            days.push(<div key={`empty-${i}`} className="p-2"></div>);
          }
          for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const dayPayments = monthPayments.filter(p => p.dueDate === dateStr);

            days.push(
              <div
                key={day}
                className={`p-2 min-h-[60px] border rounded transition-colors cursor-pointer hover:border-indigo-400 ${dayPayments.length > 0 ? 'bg-indigo-50 border-indigo-100' : 'bg-white border-slate-100'}`}
                onClick={() => setPaymentViewMode('list')}
              >
                <div className="text-xs text-slate-500 mb-1">{day}</div>
                {dayPayments.map(p => (
                  <div
                    key={p.id}
                    className={`text-xs p-1 rounded mb-1 truncate cursor-pointer ${p.status === 'paid' ? 'bg-green-200 text-green-800' :
                      p.status === 'overdue' ? 'bg-red-200 text-red-800' :
                        'bg-yellow-200 text-yellow-800'
                      }`}
                    title={`${getContractInfo(p.contractId).propName} - $${p.amount.toLocaleString()}`}
                    onClick={(e) => {
                      e.stopPropagation();
                      if (p.status !== 'paid') handleMarkAsPaid(p.id);
                    }}
                  >
                    ${(p.amount / 1000).toFixed(0)}k
                  </div>
                ))}
              </div>
            );
          }

          return (
            <div>
              <div className="flex items-center justify-between mb-4">
                <Button variant="icon" onClick={() => setCalendarMonth(new Date(year, month - 1))}>
                  <Icons.ChevronLeft size={20} />
                </Button>
                <span className="font-bold text-lg">{year}{t('calendarYear')} {month + 1}{t('calendarMonth')}</span>
                <Button variant="icon" onClick={() => setCalendarMonth(new Date(year, month + 1))}>
                  <Icons.ChevronRight size={20} />
                </Button>
              </div>
              <div className="grid grid-cols-7 gap-1 text-center text-xs text-slate-500 mb-2">
                {t('calendarWeek').map((w, i) => <div key={i}>{w}</div>)}
              </div>
              <div className="grid grid-cols-7 gap-1">
                {days}
              </div>
            </div>
          );
        };

        return (
          <div className="space-y-6 animate-fadeIn">
            <div className="flex justify-between items-center flex-wrap gap-2">
              <h2 className="text-2xl font-bold text-slate-800">{t('paymentsTitle')}</h2>
              <div className="flex gap-2">
                <Button onClick={() => openPaymentModal()} icon={Icons.Plus}>{t('newPayment')}</Button>
                {selectedIds.length > 0 && (
                  <Button onClick={handleBatchDelete} variant="danger" icon={Icons.Trash2}>
                    {t('batchDelete')} ({selectedIds.length})
                  </Button>
                )}
                <div className="flex bg-slate-100 rounded-lg p-1">
                  <button
                    className={`px-3 py-1 text-sm rounded transition-all ${paymentViewMode === 'list' ? 'bg-white shadow text-indigo-600 font-bold' : 'text-slate-500 hover:text-slate-700'}`}
                    onClick={() => setPaymentViewMode('list')}
                  >
                    {t('listView')}
                  </button>
                  <button
                    className={`px-3 py-1 text-sm rounded transition-all ${paymentViewMode === 'calendar' ? 'bg-white shadow text-indigo-600 font-bold' : 'text-slate-500 hover:text-slate-700'}`}
                    onClick={() => setPaymentViewMode('calendar')}
                  >
                    {t('calendarView')}
                  </button>
                </div>
              </div>
            </div>

            {paymentViewMode === 'calendar' ? (
              <Card className="p-6">
                <CalendarView />
              </Card>
            ) : (
              <>
                {/* 全展/全收與選取控制 */}
                <div className="flex justify-between items-center mb-2">
                  <div className="flex gap-4">
                    <button
                      className="text-xs text-indigo-600 hover:underline flex items-center gap-1"
                      onClick={() => setSelectedIds(payments.map(p => p.id))}
                    >
                      <Icons.CheckSquare size={12} /> {t('selectAll')}
                    </button>
                    {selectedIds.length > 0 && (
                      <button
                        className="text-xs text-slate-500 hover:underline flex items-center gap-1"
                        onClick={() => setSelectedIds([])}
                      >
                        <Icons.Square size={12} /> {t('deselectAll')}
                      </button>
                    )}
                  </div>
                  {Object.keys(paymentsByContract).length > 1 && (
                    <button
                      className="text-xs text-indigo-600 hover:underline"
                      onClick={toggleAll}
                    >
                      {Object.values(expandedContracts).filter(Boolean).length === contracts.length ? t('collapseAll') : t('expandAll')}
                    </button>
                  )}
                </div>

                {/* 依合約分組顯示 */}
                <div className="space-y-4">
                  {contracts.filter(c => paymentsByContract[c.id]?.length > 0).map(c => (
                    <ContractPaymentGroup
                      key={c.id}
                      contractId={c.id}
                      contractPayments={paymentsByContract[c.id]}
                    />
